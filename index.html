<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section class="calculator">
        <div class="display" id="display">0</div>
        <div class="numbers">
            <div class="number-line">
                <button class="delete" id="delete" value="delete">AC</button>
                <button class="erease" id="back" value="back">&lt;x</button>
                <button class="number operator" id="slash" value="/">/</button>
            </div>
            <div class="number-line">
                <button class="number" id="7" value="7">7</button>
                <button class="number" id="8" value="8">8</button>
                <button class="number" id="9" value="9">9</button>
                <button class="number operator" id="star" value="*">x</button>
            </div>
            <div class="number-line">
                <button class="number" id="4" value="4">4</button>
                <button class="number" id="5" value="5">5</button>
                <button class="number" id="6" value="6">6</button>
                <button class="number operator" id="minus" value="-">-</button>
            </div>
            <div class="number-line">
                <button class="number" id="1" value="1">1</button>
                <button class="number" id="2" value="2">2</button>
                <button class="number" id="3" value="3">3</button>
                <button class="number operator" id="plus" value="+">+</button>
            </div>
            <div class="number-line">
                <button class="number" id="0" value="0">0</button>
                <button class="number" id="decimalPoint" value=".">.</button>
                <button class="number operator" id="equal" value="=">=</button>
                
            </div>
        </div>
    </section>
</body>
</html>
